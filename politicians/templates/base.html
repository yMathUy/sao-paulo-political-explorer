{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Explore official political data from São Paulo.{% endblock %}">
    <title>{% block title %}São Paulo Political Explorer{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'politicians/css/styles.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include "includes/header.html" %}
    <main class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
    {% include "includes/footer.html" %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
